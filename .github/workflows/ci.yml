name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 按 lock 文件安装：peerDependencies 写的是 `*`，用 npm install 会解析到未锁定的新版本。
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 与本地同一条命令，避免两套判据。
      - name: Lint
        run: npm run lint

      # 只跑确定性单测：假 fetch 注入，不装 Pi、不调真实模型、不出网。
      - name: Test + coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
